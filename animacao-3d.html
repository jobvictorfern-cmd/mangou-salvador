<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c29"><title>Mangou · Montagem 3D</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="cup-3d.css?v=1"><style>@font-face{font-family:Body;src:url('assets/body-v2.woff2')}*{box-sizing:border-box}body{margin:0;background:#123c29;min-height:100svh;display:grid;place-items:center;padding:20px;font-family:Body,Arial,sans-serif}.preview{width:min(100%,620px)}.cup-stage{width:100%;height:min(82svh,740px);min-height:360px}a{display:block;text-align:center;color:#f9f7ed;font-size:13px;padding:16px;text-underline-offset:4px}</style><script type="module" src="cup-3d.js?v=1"></script></head><body><main class="preview">        <div class="cup-stage" data-mangou-3d data-state="loading" role="group" aria-label="Montagem do copo Mangou em 3D">
          <img class="cup-fallback" src="assets/manga.webp" alt="Copo Mangou com manga fresca e limão" width="1200" height="1600">
          <canvas class="cup-canvas" role="img" aria-label="Copo transparente em 3D recebe tiras de manga, limão e tempero; a tampa se encaixa ao final"></canvas>
          <span class="cup-stage-status" data-cup-status aria-live="polite">Preparando seu Mangou…</span>
          <div class="cup-toolbar">
            <button type="button" data-cup-toggle aria-pressed="false">Pausar</button>
            <button type="button" data-cup-replay aria-label="Reiniciar montagem" title="Reiniciar montagem">↻</button>
            <input type="range" data-cup-seek min="0" max="100" step="0.1" value="0" aria-label="Progresso da montagem">
            <button type="button" data-cup-photo aria-pressed="false">Ver foto</button>
          </div>
          <noscript><span class="cup-noscript">Manga fresca. Do seu jeito.</span></noscript>
        </div>
